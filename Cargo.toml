[workspace]
resolver = "3"
members = ["crates/axo-ai", "crates/axo-agent", "crates/axo"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://git.ryot.foo/toph/axo"

[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures = "0.3.34"
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = "0.2.38"
jsonc-parser = { version = "0.34.0", features = ["serde", "serde_json"] }
jsonschema = { version = "0.59.0", default-features = false }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "form"] }
rustix = { version = "1.1.5", features = ["process"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_norway = "0.9.42"
sha2 = "0.11.1"
similar = "3.2.0"
strip-ansi-escapes = "0.2.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util", "io-std", "process"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
