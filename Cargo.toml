[workspace]
resolver = "3"
members = ["crates/axo-ai"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://git.ryot.foo/toph/axo"

[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"] }
jsonc-parser = { version = "0.34.0", features = ["serde", "serde_json"] }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util", "io-std", "process"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
